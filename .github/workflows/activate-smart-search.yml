name: Activate smart search
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject smart search
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="smart-search.js"></script>'
          if tag not in s:
              s = s.replace('</body></html>', tag + '</body></html>')
              p.write_text(s, encoding='utf-8')
          Path('.github/workflows/activate-smart-search.yml').unlink(missing_ok=True)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/activate-smart-search.yml
          git diff --cached --quiet && exit 0
          git commit -m "فعال‌سازی جستجوی هوشمند"
          git push
